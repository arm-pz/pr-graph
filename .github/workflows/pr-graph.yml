name: PR graph merge gate
on:
  workflow_call:
    inputs:
      graph_revision:
        description: Full trusted commit SHA from arm-pz/pr-graph
        required: true
        type: string
      pr:
        required: true
        type: number
      review:
        description: JSON report from the trusted review node
        required: true
        type: string
      merge:
        default: false
        type: boolean
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Require a trusted default-branch caller
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          [[ "$EVENT" == workflow_dispatch || "$EVENT" == schedule ]]
      - name: Validate distribution revision
        shell: bash
        env:
          GRAPH_REVISION: ${{ inputs.graph_revision }}
        run: '[[ "$GRAPH_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]'
      - name: Load the shared PR Graph release
        uses: actions/checkout@v4
        with:
          repository: arm-pz/pr-graph
          ref: ${{ inputs.graph_revision }}
          path: distribution
          persist-credentials: false
      - name: Evaluate caller PR
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ inputs.review }}
          PR_NUMBER: ${{ inputs.pr }}
          MERGE: ${{ inputs.merge }}
        run: |
          printf '%s' "$REVIEW" > "$RUNNER_TEMP/review.json"
          args=("$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --review "$RUNNER_TEMP/review.json")
          if [[ "$MERGE" == true ]]; then args+=(--merge); fi
          python3 distribution/tools/pr-graph/merge_gate.py "${args[@]}"
